<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter V4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

  <div class="container py-5">
    <div class="card shadow-lg p-4 rounded-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">🔄 مبدل واحدها (ورژن ۴)</h2>
        <button id="themeBtn" class="btn btn-outline-secondary">🌙</button>
      </div>

      <!-- فرم تبدیل -->
      <form id="unitForm" class="row g-3">
        <div class="col-md-4">
          <input type="number" id="inputValue" class="form-control" placeholder="مقدار..." required>
        </div>
        <div class="col-md-3">
          <select id="fromUnit" class="form-select">
            <option value="meter">متر</option>
            <option value="kilometer">کیلومتر</option>
            <option value="centimeter">سانتی‌متر</option>
            <option value="millimeter">میلی‌متر</option>
            <option value="mile">مایل</option>
            <option value="yard">یارد</option>
            <option value="foot">فوت</option>
            <option value="inch">اینچ</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="toUnit" class="form-select">
            <option value="meter">متر</option>
            <option value="kilometer">کیلومتر</option>
            <option value="centimeter">سانتی‌متر</option>
            <option value="millimeter">میلی‌متر</option>
            <option value="mile">مایل</option>
            <option value="yard">یارد</option>
            <option value="foot">فوت</option>
            <option value="inch">اینچ</option>
          </select>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">تبدیل</button>
        </div>
      </form>

      <!-- نتیجه -->
      <div class="alert alert-info mt-4" id="result">نتیجه اینجا نمایش داده می‌شود</div>

      <!-- تاریخچه -->
      <div class="mt-4">
        <div class="d-flex justify-content-between align-items-center">
          <h5>📜 تاریخچه</h5>
          <button id="clearHistory" class="btn btn-sm btn-danger">پاک کردن</button>
        </div>
        <ul id="historyList" class="list-group mt-2"></ul>
      </div>
    </div>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
